<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>視聴画面</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="./main.js" defer></script>
  </head>
  <body>
    <!-- 動画コントロールのアイコン定義（symbolを1箇所にまとめ、各ボタンはuseで参照する） -->
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-play" viewBox="0 0 24 24">
        <polygon points="7,4 20,12 7,20" fill="currentColor" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <rect x="6" y="4" width="4" height="16" fill="currentColor" />
        <rect x="14" y="4" width="4" height="16" fill="currentColor" />
      </symbol>
      <symbol id="icon-volume-on" viewBox="0 0 24 24">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <path
          d="M16.5 8.5a5 5 0 0 1 0 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          d="M19 6a8.5 8.5 0 0 1 0 12"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-volume-off" viewBox="0 0 24 24">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
        <line
          x1="16"
          y1="9"
          x2="21"
          y2="15"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="21"
          y1="9"
          x2="16"
          y2="15"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-fullscreen-enter" viewBox="0 0 24 24">
        <path
          d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-fullscreen-exit" viewBox="0 0 24 24">
        <path
          d="M9 4v5H4M15 4v5h5M15 20v-5h5M9 20v-5H4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-arrow-down" viewBox="0 0 24 24">
        <path
          d="M6 10l6 6 6-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <path
          d="M5 13l4 4 10-10"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24">
        <path
          d="M11 4H6a2 2 0 0 0-2 2v5l9.5 9.5a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8L11 4z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <circle cx="8" cy="8" r="1.3" fill="currentColor" />
      </symbol>
      <symbol id="icon-status-error" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="9" cy="10" r="1" fill="currentColor" />
        <circle cx="15" cy="10" r="1" fill="currentColor" />
        <path
          d="M8.5 16c1-1.3 2.2-2 3.5-2s2.5.7 3.5 2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </symbol>
    </svg>
    <h1>視聴画面</h1>
    <div class="layout">
      <div class="video-area">
        <div class="video-player">
          <!-- controls属性は使わず、下のvideo-controlsでオリジナルのUIを描画する -->
          <!-- ブラウザの自動再生ポリシー上、autoplayにはmutedが必須 -->
          <video id="video" playsinline autoplay muted></video>

          <!-- ライブ配信のためシークバーは置かず、LIVE表示のみ常時出す -->
          <div class="video-live-badge">
            <span class="video-live-dot" aria-hidden="true"></span>
            LIVE
          </div>

          <!-- ミュート中であることに気づきにくいため、コントロールバーの表示状態に関わらず常時出すバッジ。
               表示中は常にミュート中＝クリックすればミュート解除できるため、ボタンにして直接操作できるようにする -->
          <button
            type="button"
            class="video-mute-badge"
            hidden
            aria-label="ミュート解除"
          >
            <svg class="icon" aria-hidden="true">
              <use id="mute-badge-icon-use" href="#icon-volume-off"></use>
            </svg>
            <span class="video-mute-badge-label-default" aria-hidden="true">ミュート中</span>
            <span class="video-mute-badge-label-hover" aria-hidden="true">ミュート解除</span>
          </button>

          <!-- 読み込み中・エラー時の状態表示。main.js がhidden/表示内容を切り替える -->
          <div class="video-status">
            <div class="video-spinner" aria-hidden="true"></div>
            <div class="video-status-error">
              <svg class="icon icon-lg" aria-hidden="true">
                <use href="#icon-status-error"></use>
              </svg>
              <p class="video-status-text">接続できないようです:(</p>
            </div>
          </div>

          <!-- 再生/一時停止操作時に中央へ一瞬浮かんでフェードアウトするアイコン。main.jsがトリガーする -->
          <div class="video-center-flash" aria-hidden="true">
            <svg class="icon">
              <use id="center-flash-icon-use" href="#icon-play"></use>
            </svg>
          </div>

          <!-- オリジナルのコントロールバー。ホバー/操作時に表示、無操作でフェードアウトする -->
          <div class="video-controls">
            <button
              type="button"
              class="video-control-button video-play-toggle"
              aria-label="再生"
            >
              <svg class="icon">
                <use id="play-icon-use" href="#icon-play"></use>
              </svg>
            </button>
            <div class="video-volume-control">
              <button
                type="button"
                class="video-control-button video-mute-toggle"
                aria-label="ミュート解除"
                aria-pressed="true"
              >
                <svg class="icon">
                  <use id="mute-icon-use" href="#icon-volume-off"></use>
                </svg>
              </button>
              <!-- (hover: hover) and (pointer: fine) な端末でのみ、ミュートボタンのホバー時に展開する。
                   iOS Safari等タッチ端末はvideo.volumeの操作が無効化されておりスライダーが機能しないため、CSSで非表示にする -->
              <input
                type="range"
                class="video-volume-slider"
                min="0"
                max="1"
                step="0.01"
                value="0.75"
                aria-label="音量"
              />
            </div>
            <div class="video-controls-spacer"></div>
            <button
              type="button"
              class="video-control-button video-fullscreen-toggle"
              aria-label="全画面表示"
            >
              <svg class="icon">
                <use id="fullscreen-icon-use" href="#icon-fullscreen-enter"></use>
              </svg>
            </button>
          </div>
        </div>
        <div class="video-meta">
          <h2 class="video-title">動画タイトル</h2>
          <p class="video-description">動画の説明文がここに表示されます。</p>
        </div>
      </div>
      <div class="sidebar">
        <div class="comment-area-wrap">
          <ul class="comment-area">
            <!-- コメント・アイテムはSSEで受信して main.js が動的に追加する -->
          </ul>
          <!-- 最下部でない間だけ表示する「下に戻る」ボタン。新着があればその件数もあわせて示す -->
          <button type="button" class="new-comment-notice" hidden>
            <!-- シェブロンを3枚重ねて、上から下へ連続して降りていく矢印に見せる -->
            <span class="new-comment-notice-icon" aria-hidden="true">
              <svg><use href="#icon-arrow-down"></use></svg>
              <svg><use href="#icon-arrow-down"></use></svg>
              <svg><use href="#icon-arrow-down"></use></svg>
            </span>
            <span class="new-comment-notice-label"></span>
          </button>
        </div>
        <form class="send-area">
          <div class="item-panel">
            <button type="button" class="item-toggle" aria-expanded="false">
              <svg class="item-toggle-icon" aria-hidden="true">
                <use href="#icon-tag"></use>
              </svg>
              アイテムを送る
            </button>
            <div class="item-price-filter" hidden>
              <!-- 値段の絞り込みはAPIのcostフィールド（実データ）を3つの帯域に分けて
                   条件にする。プレミアムは上限を設けない開放区間にして、400円超の
                   金額（例:500円）のアイテムが今後追加されても必ずどれかの帯域に
                   入るようにする -->
              <button
                type="button"
                class="item-price-button"
                data-price-filter="all"
                aria-pressed="true"
              >
                すべて
              </button>
              <button
                type="button"
                class="item-price-button"
                data-price-filter="low"
                aria-pressed="false"
              >
                プチギフト
              </button>
              <button
                type="button"
                class="item-price-button"
                data-price-filter="mid"
                aria-pressed="false"
              >
                ギフト
              </button>
              <button
                type="button"
                class="item-price-button"
                data-price-filter="high"
                aria-pressed="false"
              >
                プレミアム
              </button>
            </div>
            <div class="item-list-row" hidden>
              <button
                type="button"
                class="item-page-button item-page-prev"
                aria-label="前のアイテム"
              >
                ◀
              </button>
              <div class="item-list">
                <!-- アイテム一覧はAPIで取得して main.js が動的に追加する -->
              </div>
              <button
                type="button"
                class="item-page-button item-page-next"
                aria-label="次のアイテム"
              >
                ▶
              </button>
            </div>
          </div>
          <div class="comment-input-row">
            <!-- 選択中のアイテム（1つまで）。main.js がアイテム選択時に表示し、×または送信完了で消す -->
            <div class="selected-item-chip" hidden>
              <img class="selected-item-icon" alt="" />
              <button
                type="button"
                class="selected-item-remove"
                aria-label="アイテムの選択を解除"
              >
                ×
              </button>
            </div>
            <textarea
              class="comment-input"
              placeholder="コメントを入力"
              rows="1"
            ></textarea>
            <button
              type="button"
              class="anonymous-toggle"
              aria-pressed="false"
            >
              匿名
            </button>
            <button type="submit" class="send-button">
              <span class="send-button-label">送信</span>
              <span class="send-button-spinner" aria-hidden="true"></span>
              <span class="send-button-check" aria-hidden="true">
                <svg><use href="#icon-check"></use></svg>
              </span>
            </button>
          </div>
          <!-- 送信失敗時のみ main.js が表示するエラーメッセージ -->
          <p class="send-error" hidden></p>
        </form>
      </div>
    </div>
  </body>
</html>
